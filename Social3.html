<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltHub Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">

  <!-- TOP NAVBAR -->
  <nav class="sticky top-0 bg-black border-b border-zinc-800 p-4 z-50">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-yellow-400">⚡ VoltHub</h1>
      <div class="flex gap-5 text-xl">
        <button><i class="fa-solid fa-plus"></i></button>
        <button><i class="fa-solid fa-bell"></i></button>
        <button><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </nav>

  <!-- POSTS FEED -->
  <main id="postsFeed" class="pb-4"></main>

  <!-- COMMENT MODAL -->
  <div id="commentModal" class="hidden fixed inset-0 bg-black/90 z-[60]">
    <div class="bg-zinc-900 h-full flex flex-col">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
        <button onclick="closeModal()"><i class="fa-solid fa-arrow-left text-xl"></i></button>
        <h3 class="font-bold">Comments</h3>
        <div class="w-6"></div>
      </div>
      <div id="postInModal" class="p-4 border-b border-zinc-800"></div>
      <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      <div class="p-3 border-t border-zinc-800 bg-black">
        <div class="flex gap-2">
          <img src="https://i.pravatar.cc/100?img=12" class="w-8 h-8 rounded-full" />
          <input id="commentInput" type="text" placeholder="Add a comment..." class="flex-1 bg-zinc-800 rounded-full px-4 py-2 text-sm outline-none" />
          <button onclick="addComment()" class="text-yellow-400 font-bold px-2">Post</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 10 POSTS WITH IMAGES
    const posts = [
      {id:1, user:'ee.circuitboi', img:5, level:'400L EE', text:'That EEE 401 lab today was gbas gbos ⚡', postImg:'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=600', likes:12, liked:false, comments:[{user:'volt_queen', text:'Omo I shock 😂'}]},
      {id:2, user:'volt_queen', img:8, level:'300L EE', text:'Ghost Mode activated 👻<br>Which lecturer gives the hardest test?', postImg:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600', likes:47, liked:false, comments:[{user:'resistor_gang', text:'We all know who 😭'}]},
      {id:3, user:'400l_chief', img:3, level:'400L EE', text:'Final year project defense next week. God abeg 🙏', postImg:'https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=600', likes:89, liked:false, comments:[]},
      {id:4, user:'resistor_gang', img:15, level:'200L EE', text:'Just discovered LTSpice. Where has this been all my life?', postImg:'https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?w=600', likes:23, liked:false, comments:[]},
      {id:5, user:'cap_queen', img:20, level:'300L EE', text:'Who get past questions for EEE 321? Help a sister', postImg:'https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=600', likes:31, liked:false, comments:[]},
      {id:6, user:'inductor_bae', img:25, level:'200L EE', text:'First time soldering today. Burnt my finger but the circuit works 😎', postImg:'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600', likes:56, liked:false, comments:[]},
      {id:7, user:'transistor_king', img:32, level:'400L EE', text:'MATLAB or Python for DSP? This debate never ends', postImg:'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600', likes:72, liked:false, comments:[]},
      {id:8, user:'diode_diva', img:44, level:'300L EE', text:'Why is Circuit Theory 2 harder than Circuit Theory 1?', postImg:'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=600', likes:41, liked:false, comments:[]},
      {id:9, user:'opamp_omo', img:51, level:'200L EE', text:'Op-amp lab = op-pain 😩', postImg:'https://images.unsplash.com/photo-1581092921461-eab62e97a780?w=600', likes:19, liked:false, comments:[]},
      {id:10, user:'volt_master', img:60, level:'500L EE', text:'Last semester in Uniport EE. Time flies fr ⚡', postImg:'https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=600', likes:103, liked:false, comments:[{user:'400l_chief', text:'Senior don dey go o'}]},
    ];

    let currentPostId = null;

    // RENDER ALL 10 POSTS WITH IMAGES
    function renderPosts() {
      const feed = document.getElementById('postsFeed');
      feed.innerHTML = posts.map(post => `
        <div class="border-b border-zinc-800">
          <div class="p-4">
            <div class="flex items-center gap-3 mb-3">
              <img src="https://i.pravatar.cc/100?img=${post.img}" class="w-10 h-10 rounded-full" />
              <div>
                <p class="font-bold">${post.user}</p>
                <p class="text-zinc-500 text-sm">${post.level} · 2h</p>
              </div>
            </div>
            <p class="mb-3">${post.text}</p>
          </div>
          <!-- POST IMAGE -->
          <img src="${post.postImg}" class="w-full max-h-96 object-cover" alt="post image" />
          <div class="p-4">
            <div class="flex gap-6 text-xl text-zinc-500">
              <button onclick="toggleLike(${post.id})">
                <i class="fa-${post.liked? 'solid text-red-500' : 'regular'} fa-heart"></i>
                <span class="text-sm">${post.likes}</span>
              </button>
              <button onclick="openComments(${post.id})">
                <i class="fa-regular fa-comment"></i>
                <span class="text-sm">${post.comments.length}</span>
              </button>
              <button><i class="fa-regular fa-paper-plane"></i></button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // LIKE / UNLIKE
    function toggleLike(postId) {
      const post = posts.find(p => p.id === postId);
      post.liked =!post.liked;
      post.likes += post.liked? 1 : -1;
      renderPosts();
    }

    // OPEN COMMENT MODAL
    function openComments(postId) {
      currentPostId = postId;
      const post = posts.find(p => p.id === postId);

      document.getElementById('postInModal').innerHTML = `
        <div class="flex items-center gap-3 mb-2">
          <img src="https://i.pravatar.cc/100?img=${post.img}" class="w-8 h-8 rounded-full" />
          <p class="font-bold text-sm">${post.user}</p>
        </div>
        <p class="text-sm mb-2">${post.text}</p>
        <img src="${post.postImg}" class="w-full rounded-lg max-h-60 object-cover" />
      `;

      const list = document.getElementById('commentsList');
      list.innerHTML = post.comments.length? post.comments.map(c => `
        <div class="flex gap-3">
          <img src="https://i.pravatar.cc/100?img=12" class="w-8 h-8 rounded-full" />
          <div class="flex-1 bg-zinc-800 rounded-xl p-3">
            <p class="font-bold text-sm">${c.user}</p>
            <p class="text-sm">${c.text}</p>
          </div>
        </div>
      `).join('') : '<p class="text-zinc-500 text-center text-sm">No comments yet. Be the first!</p>';

      document.getElementById('commentModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('commentModal').classList.add('hidden');
      document.getElementById('commentInput').value = '';
      currentPostId = null;
    }

    // ADD COMMENT
    function addComment() {
      const input = document.getElementById('commentInput');
      if(!input.value.trim()) return;

      const post = posts.find(p => p.id === currentPostId);
      post.comments.push({user: 'you.ee.ng', text: input.value});
      input.value = '';
      openComments(currentPostId);
      renderPosts();
    }

    // START APP
    renderPosts();
  </script>

</body>
</html>
