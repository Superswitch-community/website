<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoltHub - EE Social</title>

  <!-- PWA STUFF -->
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="data:application/manifest+json,{
    'name': 'VoltHub',
    'short_name': 'VoltHub',
    'start_url': '.',
    'display': 'standalone',
    'background_color': '#000000',
    'theme_color': '#facc15',
    'icons': [{'src': 'https://i.ibb.co/7jQ3Z1V/volt-icon.png', 'sizes': '192x192', 'type': 'image/png'}]
  }">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    body { padding-bottom: 70px; }
   .active-tab { color: #facc15; }
   .scrollbar-hide::-webkit-scrollbar { display: none; }
   .page { display: none; }
   .page.active { display: block; }
    #installBanner { animation: slideUp 0.3s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  </style>
</head>
<body class="bg-black text-white font-sans">

  <!-- INSTALL APP BANNER -->
  <div id="installBanner" class="hidden fixed bottom-20 left-4 right-4 bg-zinc-900 border border-yellow-400 rounded-xl p-4 z-50">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-download text-yellow-400 text-2xl"></i>
        <div>
          <p class="font-bold text-sm">Install VoltHub</p>
          <p class="text-xs text-zinc-400">Add to home screen for app experience</p>
        </div>
      <div class="flex gap-2">
        <button onclick="dismissInstall()" class="text-zinc-500 text-sm px-2">Later</button>
        <button id="installBtn" class="bg-yellow-400 text-black px-3 py-1 rounded-lg text-sm font-bold">Install</button>
      </div>
    </div>
  </div>

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 bg-black border-b border-zinc-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-yellow-400">⚡ VoltHub</h1>
      <div class="flex gap-4 text-xl">
        <button onclick="openCreatePost()"><i class="fa-solid fa-plus"></i></button>
        <button onclick="switchPage('chat')"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </header>

  <!-- HOME PAGE -->
  <div id="homePage" class="page active">
    <!-- STORIES BAR -->
    <div class="px-4 py-3 border-b border-zinc-800 overflow-x-auto scrollbar-hide">
      <div class="flex gap-4" id="storiesContainer"></div>
    </div>
    <!-- FEED CONTENT -->
    <main id="feed" class="pb-4"></main>
  </div>

  <!-- CHAT PAGE -->
  <div id="chatPage" class="page">
    <div class="p-4 border-b border-zinc-800">
      <h2 class="text-xl font-bold">Chats</h2>
    </div>
    <div id="chatList" class="divide-y divide-zinc-800"></div>
  </div>

  <!-- CHAT WINDOW -->
  <div id="chatWindow" class="page">
    <div class="sticky top-0 bg-black border-b border-zinc-800 p-3 flex items-center gap-3 z-40">
      <button onclick="switchPage('chat')"><i class="fa-solid fa-arrow-left"></i></button>
      <img id="chatUserImg" src="" class="w-10 h-10 rounded-full" />
      <div>
        <p id="chatUserName" class="font-bold"></p>
        <p class="text-xs text-green-500">online</p>
      </div>
    <div id="messagesContainer" class="p-4 space-y-3 min-h-[70vh]"></div>
    <div class="fixed bottom-16 left-0 right-0 bg-black border-t border-zinc-800 p-3">
      <div class="flex gap-2">
        <input id="msgInput" type="text" placeholder="Message..." class="flex-1 bg-zinc-900 rounded-full px-4 py-2 outline-none" />
        <button onclick="sendMessage()" class="bg-yellow-400 text-black w-10 h-10 rounded-full"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- SEARCH PAGE -->
  <div id="searchPage" class="page p-4">
    <input type="text" placeholder="Search EE students..." class="w-full bg-zinc-900 rounded-lg px-4 py-3 outline-none mb-4" />
    <p class="text-zinc-500 text-center mt-10">Search feature coming soon</p>
  </div>

  <!-- PROFILE PAGE -->
  <div id="profilePage" class="page p-4">
    <div class="text-center py-8">
      <img src="https://i.pravatar.cc/100?img=12" class="w-24 h-24 rounded-full mx-auto mb-3 border-2 border-yellow-400" />
      <h2 class="text-xl font-bold">you.ee.ng</h2>
      <p class="text-zinc-500">400L Electrical Engineering</p>
      <p class="text-zinc-400 text-sm mt-2">Building VoltHub ⚡</p>
    </div>
  </div>

  <!-- COMMENTS MODAL -->
  <div id="commentModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-end">
    <div class="bg-zinc-900 w-full rounded-t-2xl max-h-[80vh] flex flex-col">
      <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
        <h3 class="font-bold">Comments</h3>
        <button onclick="closeComments()"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div id="commentsList" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
      <div class="p-3 border-t border-zinc-800">
        <div class="flex gap-2">
          <img src="https://i.pravatar.cc/100?img=12" class="w-8 h-8 rounded-full" />
          <input id="commentInput" type="text" placeholder="Add a comment..." class="flex-1 bg-zinc-800 rounded-full px-4 py-2 text-sm outline-none" />
          <button onclick="addComment()" class="text-yellow-400 font-bold">Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CREATE POST MODAL -->
  <div id="createPostModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
    <div class="bg-zinc-900 w-full max-w-lg rounded-2xl p-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg">Create Post</h3>
        <button onclick="closeCreatePost()"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <textarea id="postText" placeholder="What's on your mind, EE?" class="w-full bg-zinc-800 rounded-lg p-3 h-32 outline-none resize-none"></textarea>
      <button onclick="submitPost()" class="w-full bg-yellow-400 text-black font-bold py-3 rounded-lg mt-3">Post</button>
    </div>
  </div>

  <!-- BOTTOM NAVBAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-black border-t border-zinc-800 z-50">
    <div class="flex justify-around items-center h-16">
      <button onclick="switchPage('home')" class="tab-btn active-tab text-2xl"><i class="fa-solid fa-house"></i></button>
      <button onclick="switchPage('search')" class="tab-btn text-zinc-500 text-2xl"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button onclick="openCreatePost()" class="tab-btn text-zinc-500 text-2xl"><i class="fa-regular fa-square-plus"></i></button>
      <button onclick="switchPage('chat')" class="tab-btn text-zinc-500 text-2xl"><i class="fa-regular fa-comment-dots"></i></button>
      <button onclick="switchPage('profile')" class="tab-btn text-zinc-500 text-2xl">
        <img src="https://i.pravatar.cc/100?img=12" class="w-7 h-7 rounded-full" />
      </button>
    </div>
  </nav>

  <!-- TOAST -->
  <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-zinc-800 text-white px-4 py-2 rounded-full text-sm hidden z-[70]">Coming Soon</div>

  <script>
    // FAKE DATABASE
    const DB = {
      users: [
        {id: 1, name: 'ee.circuitboi', img: 'https://i.pravatar.cc/100?img=5', level: '400L EE'},
        {id: 2, name: 'volt_queen', img: 'https://i.pravatar.cc/100?img=8', level: '300L EE'},
        {id: 3, name: '400l_chief', img: 'https://i.pravatar.cc/100?img=3', level: '400L EE'},
        {id: 4, name: 'resistor_gang', img: 'https://i.pravatar.cc/100?img=15', level: '200L EE'},
      ],
      posts: [
        {id: 1, userId: 1, text: 'That EEE 401 lab today was gbas gbos ⚡ Who else nearly blew the multimeter? 😭', likes: 12, liked: false, comments: [
          {userId: 2, text: 'Omo I shock 😂', time: '1h'},
          {userId: 3, text: 'Mine actually smoked', time: '45m'}
        ]},
        {id: 2, userId: 2, text: 'Ghost Mode activated 👻<br>Which lecturer gives the hardest test? I’m not mentioning names but E-E-E... 👀', likes: 47, liked: false, comments: [
          {userId: 1, text: 'We all know who 😭', time: '3h'},
          {userId: 4, text: 'Make I no talk', time: '2h'}
        ]},
      ],
      chats: [
        {userId: 1, lastMsg: 'You do that assignment?', time: '2m', unread: 2},
        {userId: 2, lastMsg: 'See you for lab', time: '1h', unread: 0},
        {userId: 3, lastMsg: 'Bro we need talk', time: '3h', unread: 1},
      ],
      messages: {
        1: [{from: 1, text: 'You do that EEE 401 assignment?', time: '2m'}, {from: 0, text: 'Which one? The lab report?', time: '1m'}],
        2: [{from: 2, text: 'See you for lab tomorrow', time: '1h'}],
        3: [{from: 3, text: 'Bro we need talk about project', time: '3h'}],
      }
    };

    let currentPostId = null;
    let currentChatUserId = null;
    let deferredPrompt;

    // INIT
    window.onload = () => {
      renderStories();
      renderFeed();
      renderChatList();
      checkPWA();
    };

    // PWA INSTALL
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').classList.remove('hidden');
    });

    document.getElementById('installBtn').addEventListener('click', async () => {
      if(deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
        document.getElementById('installBanner').classList.add('hidden');
      }
    });

    function dismissInstall() {
      document.getElementById('installBanner').classList.add('hidden');
    }

    function checkPWA() {
      if(window.matchMedia('(display-mode: standalone)').matches) {
        showToast('Running as app ⚡');
      }
    }

    // PAGE SWITCHING
    function switchPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(page + 'Page').classList.add('active');

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active-tab');
        btn.classList.add('text-zinc-500');
      });
      event.currentTarget?.classList.add('active-tab');
      event.currentTarget?.classList.remove('text-zinc-500');
    }

    // RENDER STORIES
    function renderStories() {
      const container = document.getElementById('storiesContainer');
      container.innerHTML = `
        <div class="text-center">
          <div class="w-16 h-16 rounded-full bg-zinc-800 border-2 border-yellow-400 flex items-center justify-center text-2xl">
            <i class="fa-solid fa-plus text-yellow-400"></i>
          </div>
          <p class="text-xs mt-1 text-zinc-400">Your Story</p>
        </div>
      ` + DB.users.map(u => `
        <div class="text-center">
          <img src="${u.img}" class="w-16 h-16 rounded-full border-2 border-zinc-600" />
          <p class="text-xs mt-1 text-zinc-400">${u.name}</p>
        </div>
      `).join('');
    }

    // RENDER FEED
    function renderFeed() {
      const feed = document.getElementById('feed');
      feed.innerHTML = DB.posts.map(post => {
        const user = DB.users.find(u => u.id === post.userId);
        return `
          <article class="border-b border-zinc-800">
            <div class="flex items-center gap-3 p-4">
              <img src="${user.img}" class="w-10 h-10 rounded-full" />
              <div>
                <p class="font-bold">${user.name} <span class="text-zinc-500 text-sm">· 2h</span></p>
                <p class="text-zinc-500 text-sm">${user.level}</p>
              </div>
              <button class="ml-auto text-zinc-500"><i class="fa-solid fa-ellipsis"></i></button>
            </div>
            <p class="px-4 pb-3">${post.text}</p>
            <div class="flex justify-around text-xl text-zinc-500 pb-3">
              <button onclick="likePost(${post.id}, this)" class="hover:text-red-500 ${post.liked? 'text-red-500' : ''}">
                <i class="fa-${post.liked? 'solid' : 'regular'} fa-heart"></i> <span class="text-sm">${post.likes}</span>
              </button>
              <button onclick="openComments(${post.id})">
                <i class="fa-regular fa-comment"></i> <span class="text-sm">${post.comments.length}</span>
              </button>
              <button onclick="showToast('Share Soon')"><i class="fa-regular fa-paper-plane"></i></button>
              <button onclick="savePost(this)"><i class="fa-regular fa-bookmark"></i></button>
            </div>
          </article>
        `;
      }).join('');
    }

    // LIKE POST
    function likePost(postId, btn) {
      const post = DB.posts.find(p => p.id === postId);
      const icon = btn.querySelector('i');
      const count = btn.querySelector('span');
      post.liked =!post.liked;
      post.likes += post.liked? 1 : -1;
      icon.className = `fa-${post.liked? 'solid' : 'regular'} fa-heart ${post.liked? 'text-red-500' : ''}`;
      count.textContent = post.likes;
    }

    // COMMENTS
    function openComments(postId) {
      currentPostId = postId;
      const post = DB.posts.find(p => p.id === postId);
      const list = document.getElementById('commentsList');
      list.innerHTML = post.comments.map(c => {
        const user = DB.users.find(u => u.id === c.userId);
        return `
          <div class="flex gap-3">
            <img src="${user.img}" class="w-8 h-8 rounded-full" />
            <div class="flex-1">
              <p class="text-sm"><span class="font-bold">${user.name}</span> <span class="text-zinc-500">${c.time}</span></p>
              <p class="text-sm text-zinc-300">${c.text}</p>
            </div>
          </div>
        `;
      }).join('');
      document.getElementById('commentModal').classList.remove('hidden');
    }

    function closeComments() {
      document.getElementById('commentModal').classList.add('hidden');
      currentPostId = null;
    }

    function addComment() {
      const input = document.getElementById('commentInput');
      if(!input.value.trim()) return;
      const post = DB.posts.find(p => p.id === currentPostId);
      post.comments.push({userId: 0, text: input.value, time: 'now'});
      input.value = '';
      openComments(currentPostId);
      renderFeed();
    }

    // CREATE POST
    function openCreatePost() {
      document.getElementById('createPostModal').classList.remove('hidden');
    }
    function closeCreatePost() {
      document.getElementById('createPostModal').classList.add('hidden');
    }
    function submitPost() {
      const text = document.getElementById('postText').value;
      if(!text.trim()) return;
      DB.posts.unshift({id: Date.now(), userId: 0, text, likes: 0, liked: false, comments: []});
      document.getElementById('postText').value = '';
      closeCreatePost();
      renderFeed();
      showToast('Posted!');
    }

    // CHAT
    function renderChatList() {
      const list = document.getElementById('chatList');
      list.innerHTML = DB.chats.map(chat => {
        const user = DB.users.find(u => u.id === chat.userId);
        return `
          <div onclick="openChatWindow(${chat.userId})" class="p-4 flex items-center gap-3 hover:bg-zinc-900 cursor-pointer">
            <img src="${user.img}" class="w-12 h-12 rounded-full" />
            <div class="flex-1">
              <div class="flex justify-between">
                <p class="font-bold">${user.name}</p>
                <p class="text-xs text-zinc-500">${chat.time}</p>
              </div>
              <p class="text-sm text-zinc-400">${chat.lastMsg}</p>
            </div>
            ${chat.unread? `<span class="bg-yellow-400 text-black text-xs w-5 h-5 rounded-full flex items-center justify-center">${chat.unread}</span>` : ''}
          </div>
        `;
      }).join('');
    }

    function openChatWindow(userId) {
      currentChatUserId = userId;
      const user = DB.users.find(u => u.id === userId);
      document.getElementById('chatUserImg').src = user.img;
      document.getElementById('chatUserName').textContent = user.name;
      renderMessages();
      switchPage('chatWindow');
    }

    function renderMessages() {
      const container = document.getElementById('messagesContainer');
      const msgs = DB.messages[currentChatUserId] || [];
      container.innerHTML = msgs.map(m => `
        <div class="flex ${m.from === 0? 'justify-end' : 'justify-start'}">
          <div class="${m.from === 0? 'bg-yellow-400 text-black' : 'bg-zinc-800'} px-4 py-2 rounded-2xl max-w-[70%]">
            <p class="text-sm">${m.text}</p>
            <p class="text-xs opacity-70 mt-1">${m.time}</p>
          </div>
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      if(!input.value.trim()) return;
      if(!DB.messages[currentChatUserId]) DB.messages[currentChatUserId] = [];
      DB.messages[currentChatUserId].push({from: 0, text: input.value, time: 'now'});
      input.value = '';
      renderMessages();
      // Fake reply
      setTimeout(() => {
        DB.messages[currentChatUserId].push({from: currentChatUserId, text: 'Got it ⚡', time: 'now'});
        renderMessages();
      }, 1000);
    }

    // SAVE + TOAST
    function savePost(btn) {
      const icon = btn.querySelector('i');
      if(icon.classList.contains('fa-regular')) {
        icon.classList.replace('fa-regular', 'fa-solid');
        icon.classList.add('text-yellow-400');
        showToast('Saved');
      } else {
        icon.classList.replace('fa-solid', 'fa-regular');
        icon.classList.remove('text-yellow-400');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2000);
    }
  </script>

</body>
        </html>
